services:
  db:
    image: postgres:16-alpine
    container_name: report-card-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: report_card
    ports:
      - "5433:5432"
    volumes:
      - report_card_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  report_card_pg:
